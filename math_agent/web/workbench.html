<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学 Agent · JSXGraph</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#18304a;font:15px system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1440px;margin:auto;padding:32px 24px}h1{font-size:28px}header p{color:#607890;line-height:1.8}.workspace{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px}form{background:white;padding:24px;border-radius:16px;align-self:start}label{display:block;font-weight:600;margin:18px 0 8px}input:not([type=checkbox]),textarea{width:100%;padding:10px;border:1px solid #cbd8e6;border-radius:7px;font:inherit}textarea{resize:vertical}input[type=file]{font-size:13px}button{font:inherit;border:0;border-radius:8px;padding:12px 18px;background:#1b609c;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:8px;margin-top:20px}#cancel{background:#e9eff6;color:#315676}.hint{font-size:12px;color:#687f95;line-height:1.7}.check{font-size:13px;font-weight:400}#status{white-space:pre-wrap;line-height:1.7;padding:18px;background:#e7eff8;border-radius:12px;overflow-wrap:anywhere}iframe{border:0;border-radius:12px;width:100%;height:850px;background:white}#empty{padding:80px 24px;text-align:center;background:white;border-radius:16px;color:#71869c}#recover{background:transparent;color:#315676;border:1px solid #b9cadc;padding:8px 12px;margin-top:8px}@media(max-width:820px){main{padding:20px 12px}.workspace{grid-template-columns:1fr}iframe{height:1100px}}
</style></head><body><main><header><h1>数学 Agent</h1><p>上传题目和参考答案，生成可以操作的数学讲解。<br>JSXGraph 在线图形 · 支持文字题、题图和答案图</p></header><div class="workspace"><form id="form"><label for="token">服务访问令牌</label><input id="token" type="password" autocomplete="off" required><p class="hint">输入本服务的访问令牌。模型密钥保存在服务器端。</p><label for="text">题目文字（可选）</label><textarea id="text" rows="5" placeholder="也可以直接输入完整题目"></textarea><label for="question">题目图片</label><input id="question" type="file" accept="image/png,image/jpeg,image/webp" multiple><label for="answer">参考答案图片（可选）</label><input id="answer" type="file" accept="image/png,image/jpeg,image/webp" multiple><p class="hint">题图与答案图合计最多 6 张，每张不超过 32 MiB。支持长图，系统自动分区读取，无需手动裁剪。</p><label class="check"><input id="force" type="checkbox"> 强制重新问模型（会重新计费）</label><div class="actions"><button id="submit">生成讲解</button><button id="cancel" type="button" disabled>取消</button></div><label for="job">已有任务编号</label><input id="job" placeholder="继续查看已提交的任务"><button id="recover" type="button">查看任务</button></form><section><p id="status" role="status">准备就绪，等待提交题目。</p><details id="ocr" hidden><summary>查看文字与公式识别结果（请对照原图）</summary><pre id="ocrtext" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto"></pre></details><div id="empty">生成完成后，交互图形和解题过程会出现在这里。</div><iframe id="preview" title="数学讲解在线预览" sandbox="allow-scripts" referrerpolicy="no-referrer" hidden></iframe></section></div></main><script>
(() => {
const $=id=>document.getElementById(id);let current=null,timer=null,generation=0;
const terminal=new Set(['completed','failed','needs_input','cancelled','interrupted']);
const status=text=>$('status').textContent=text;
function busy(on){$('submit').disabled=on;$('cancel').disabled=!on;$('recover').disabled=on;}
async function api(path,options={}){const token=$('token').value.trim();if(!token)throw Error('请先输入服务访问令牌');const r=await fetch(path,{...options,headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok){let body;try{body=await r.json();}catch{body={error:'请求失败 '+r.status};}throw Error(body.error||'请求失败');}return r;}
async function poll(epoch){try{const row=await(await api('/api/jobs/'+encodeURIComponent(current))).json();if(epoch!==generation)return;status('任务：'+row.id+'\n状态：'+row.status+'\n阶段：'+row.stage+(row.error?'\n'+row.error:''));if(terminal.has(row.status)){busy(false);if(row.ocr_url){const pages=await(await api(row.ocr_url)).json();if(epoch!==generation)return;$('ocrtext').textContent=pages.map(p=>(p.role==='question'?'题目':'参考答案')+' '+p.image_id+'\n'+p.text+'\n'+p.warnings.join('\n')).join('\n\n');$('ocr').hidden=false;}if(row.status==='completed'){const html=await(await api(row.preview_url)).text();if(epoch!==generation)return;$('preview').srcdoc=html;$('preview').hidden=false;$('empty').hidden=true;}return;}timer=setTimeout(()=>poll(epoch),2000);}catch(e){if(epoch===generation){status(e.message+'\n任务可能仍在服务端运行，可用任务编号继续查看。');busy(false);}}}
$('form').onsubmit=async e=>{e.preventDefault();clearTimeout(timer);generation++;const epoch=generation;busy(true);$('ocr').hidden=true;$('ocrtext').textContent='';$('preview').hidden=true;$('preview').srcdoc='';$('empty').hidden=false;try{const data=new FormData();data.set('text',$('text').value);data.set('force',String($('force').checked));for(const role of ['question','answer'])for(const f of $(role).files)data.append(role,f);const row=await(await api('/api/jobs',{method:'POST',body:data})).json();current=row.id;$('job').value=current;await poll(epoch);}catch(err){status(err.message);busy(false);}};
$('cancel').onclick=async()=>{if(current)try{await api('/api/jobs/'+encodeURIComponent(current)+'/cancel',{method:'POST'});clearTimeout(timer);await poll(generation);}catch(e){status(e.message);}};
$('recover').onclick=()=>{current=$('job').value.trim();if(!current){status('请输入任务编号');return;}clearTimeout(timer);generation++;$('ocr').hidden=true;$('ocrtext').textContent='';busy(true);poll(generation);};
})();
</script></body></html>
